name: Semgrep

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  semgrep:
    name: Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: '🤌 Checkout'
        uses: actions/checkout@v7

      - name: '🔍 Run Semgrep'
        id: semgrep
        continue-on-error: true
        run: |
          set +e
          # Pull image first to avoid pull output in results
          docker pull semgrep/semgrep:latest > /dev/null 2>&1

          # Run semgrep and capture output
          # Actions stay on major version tags so Dependabot keeps them current
          # without a SHA churn PR every release; excluded rather than ignored
          # per-line so there is one place to flip it back on.
          docker run --rm -v "${PWD}:/src" semgrep/semgrep:latest semgrep scan --config auto --error --text \
            --exclude-rule yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag 2>&1 | tee semgrep-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Exit code: $EXIT_CODE"
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

          # Always capture output for PR comment
          {
            echo 'findings<<EOF'
            cat semgrep-output.txt
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: '💬 Post PR Comment'
        if: github.event_name == 'pull_request' && steps.semgrep.outputs.exit_code != '0'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: semgrep
          recreate: true
          message: |
            ## 🔍 Semgrep Security Findings

            ```
            ${{ steps.semgrep.outputs.findings }}
            ```

      - name: '❌ Fail if findings'
        if: steps.semgrep.outputs.exit_code != '0'
        run: |
          echo "Failing due to exit code: ${{ steps.semgrep.outputs.exit_code }}"
          exit 1
