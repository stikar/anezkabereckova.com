name: Test

on:
  pull_request:
    branches:
      - production
      - dev
  push:
    branches:
      - dev
    paths-ignore:
      - '**.md'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Check build output
        run: |
          if [ ! -d "out" ]; then
            echo "Build output directory 'out' not found"
            exit 1
          fi
          if [ ! -f "out/index.html" ]; then
            echo "index.html not found in build output"
            exit 1
          fi
          if [ ! -d "out/contact" ]; then
            echo "contact directory not found in build output"
            exit 1
          fi
          if [ ! -f "out/contact/index.html" ]; then
            echo "contact/index.html not found in build output"
            exit 1
          fi
          echo "Build output verified successfully (index.html and contact page found)"
