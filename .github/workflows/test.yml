name: Test

on:
  pull_request:
    branches:
      - production
      - dev
  push:
    branches:
      - dev
    paths-ignore:
      - '**.md'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build (generate + next build + sitemap/sw)
        run: npm run build

      - name: Check build output
        run: |
          for f in out/index.html out/projekty/index.html out/en/index.html out/sw.js out/sitemap.xml out/robots.txt out/manifest.webmanifest; do
            [ -f "$f" ] || { echo "Missing $f"; exit 1; }
          done
          echo "Build output verified"
