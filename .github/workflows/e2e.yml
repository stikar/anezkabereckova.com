name: E2E Production

on:
  schedule:
    # every day at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/e2e.yml'
      - 'e2e/**'

jobs:
  e2e:
    runs-on: ubuntu-latest
    # 6 attempts x ~3 min worst case, plus install
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E against production
        run: npx playwright test e2e --retries=5
